name: Release Artifacts (dry run)

# Non-publishing verification of the portable release bundles. Builds the real
# platform bundles and runs a functional smoke (server readiness, endpoint,
# clean shutdown, no orphan) WITHOUT publishing npm or creating/replacing any
# GitHub Release. Never requires a release tag.
on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  bundle-smoke:
    name: Bundle smoke ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: windows-2022
            platform: windows
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repository dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps
          npm install --no-package-lock --legacy-peer-deps --no-save vite@8.2.2
          npm --prefix cli install --no-package-lock --ignore-scripts --legacy-peer-deps

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build CLI package
        run: npm --prefix cli run build

      - name: Build portable runtime bundle (dry run, no publish)
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: >-
          node scripts/package-release-bundle.mjs --tool "showdar-router" --bin-name "showdar-router" --package-name "showdar-router" --package-dir "cli" --entry "cli.js" --version "${{ steps.version.outputs.value }}" --ignore-install-scripts true

      - name: Functional bundle smoke
        shell: bash
        run: node scripts/release-bundle-smoke.mjs --bundle .release/bundle --version "${{ steps.version.outputs.value }}"
