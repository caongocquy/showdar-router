name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill (for example v1.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify package version
        env:
          PACKAGE_JSON: cli/package.json
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, "utf8"));
            if (pkg.version !== process.env.VERSION) {
              throw new Error(`Package version ${pkg.version} does not match release ${process.env.VERSION}`);
            }
          '

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            asset: showdar-router-darwin-arm64.tar.gz
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            asset: showdar-router-darwin-x64.tar.gz
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            asset: showdar-router-linux-x64.tar.gz
          - runner: windows-2022
            platform: windows
            arch: x64
            asset: showdar-router-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      # Explicit manual backfill of a historical tag: load the approved release
      # tooling from the default branch. An ordinary tag push never does this and
      # uses only the tooling that shipped inside that tag. The list is the full
      # transitive closure (package-release-bundle.mjs imports lib/npm-invocation.mjs).
      - name: Refresh release tooling for manual backfill
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING: scripts/package-release-bundle.mjs scripts/lib/npm-invocation.mjs scripts/release-bundle-smoke.mjs scripts/verify-release-assets.mjs
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          for file in $TOOLING; do
            mkdir -p "$(dirname "$file")"
            git show "FETCH_HEAD:$file" > "$file"
          done

      # Deterministic availability check for every event: a historical tag that
      # lacks a required script must fail here visibly rather than at a later
      # step, and a backfill that could not restore a script must not proceed.
      - name: Verify required release tooling is present
        shell: bash
        env:
          TOOLING: scripts/package-release-bundle.mjs scripts/lib/npm-invocation.mjs scripts/release-bundle-smoke.mjs scripts/verify-release-assets.mjs
        run: |
          set -euo pipefail
          missing=0
          for file in $TOOLING; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required release tooling missing: $file"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repository dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps
          npm install --no-package-lock --legacy-peer-deps --no-save vite@8.2.2
          npm --prefix cli install --no-package-lock --ignore-scripts --legacy-peer-deps

      - name: Build CLI package
        run: npm --prefix cli run build

      - name: Build portable runtime bundle
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: >-
          node scripts/package-release-bundle.mjs --tool "showdar-router" --bin-name "showdar-router" --package-name "showdar-router" --package-dir "cli" --entry "cli.js" --version "${{ needs.metadata.outputs.version }}" --ignore-install-scripts true

      # Same authoritative functional smoke the dry-run workflow runs: bundled
      # runtime --version, bundled server startup, /api/health and /api/version
      # = 200, clean shutdown, no orphan listener. Archives are created below, so
      # a bundle that cannot actually run never becomes an asset.
      - name: Functional bundle smoke
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/release-bundle-smoke.mjs --bundle .release/bundle --version "${{ needs.metadata.outputs.version }}"; then
            echo "::error::Functional bundle smoke failed. For workflow_dispatch this means the historical bundle is unsupported by the current smoke tooling; do not treat it as a passing backfill."
            exit 1
          fi

      - name: Create tar.gz archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: tar -C .release/bundle -czf "$ASSET" .

      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: Compress-Archive -Path '.release/bundle/*' -DestinationPath $env:ASSET -CompressionLevel Optimal

      - name: Write SHA-256 checksum
        env:
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const file = process.env.ASSET;
            const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            fs.writeFileSync(`${file}.sha256`, `${hash}  ${path.basename(file)}\n`);
          '

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Attach assets to GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      # A backfilled tag may predate this verifier; take the current approved
      # tooling from the default branch so the completeness gate always runs the
      # current logic.
      - name: Refresh release verifier for manual backfill
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING: scripts/verify-release-assets.mjs
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          for file in $TOOLING; do
            mkdir -p "$(dirname "$file")"
            git show "FETCH_HEAD:$file" > "$file"
          done

      - name: Verify release verifier is present
        shell: bash
        run: |
          set -euo pipefail
          [[ -f scripts/verify-release-assets.mjs ]] || {
            echo "::error::Required release tooling missing: scripts/verify-release-assets.mjs" >&2
            exit 1
          }

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Wait for release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Require exactly the four expected archives, each with one matching
          # checksum, and verify every archive/checksum pair before publishing.
          node scripts/verify-release-assets.mjs --dir release-assets
          found=0
          for attempt in {1..120}; do
            if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              found=1
              break
            fi
            echo "GitHub Release $TAG is not available yet; retry $attempt/120"
            sleep 10
          done
          [[ "$found" -eq 1 ]] || {
            echo "GitHub Release $TAG was not created in time" >&2
            exit 1
          }
          # Tag pushes must not overwrite existing assets, so a partial upload
          # stays detectable. Explicit backfill runs may replace assets on purpose.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release upload "$TAG" release-assets/* --repo "$GH_REPO" --clobber
          else
            gh release upload "$TAG" release-assets/* --repo "$GH_REPO"
          fi
