name: Pull request verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11.5.1
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version

      - name: Install repository dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps
          npm install --no-package-lock --legacy-peer-deps --no-save vite@8.2.2
          npm --prefix cli install --no-package-lock --ignore-scripts --legacy-peer-deps

      - name: Run routing tests
        run: npm run test:routing

      # tests/unit/showdar-router-daemon.test.mjs was deleted in bd78c872
      # (daemon/launcher split replaced by the cli.js supervisor). Its
      # intentional replacement coverage is cli-tray-behavioral.test.mjs.
      # File existence alone is not enough: vitest silently ignores CLI
      # filters that match no file, so include/config drift could drop a
      # required suite while the remaining suites keep this step green.
      # Assert per file: collected, >0 executed tests, zero failures.
      - name: Run regression and focused release tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/unit/provider-model-discovery.test.js
            tests/unit/finish-reason-logging.test.js
            tests/unit/launcher-tray.test.mjs
            tests/unit/cli-tray-behavioral.test.mjs
            tests/unit/cli-source-parity.test.js
            tests/unit/donate-modal.test.js
            tests/unit/combo-autoswitch.test.js
            tests/unit/combo-cancellation.test.js
            tests/unit/combo-planner.test.js
            tests/unit/fusion-strip-stream-options-3024.test.js
          )
          for f in "${tests[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Expected test file missing: $f" >&2
              exit 1
            fi
          done
          printf '%s\n' "${tests[@]}" > /tmp/focused-expected-files.txt
          set +e
          npx vitest run --reporter=default --reporter=json --outputFile.json=/tmp/focused-report.json "${tests[@]}"
          vitest_exit=$?
          node - <<'NODE'
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("/tmp/focused-report.json", "utf8"));
          } catch (error) {
            console.error(`::error::Focused test report missing or unreadable: ${error.message}`);
            process.exit(1);
          }
          const expected = fs
            .readFileSync("/tmp/focused-expected-files.txt", "utf8")
            .split("\n")
            .filter(Boolean);
          const byName = new Map(
            report.testResults.map((result) => [
              result.name.replace(/^.*[\\/]tests[\\/]/, "tests/"),
              result,
            ]),
          );
          let ok = true;
          for (const file of expected) {
            const result = byName.get(file);
            if (!result) {
              console.error(`::error::Expected test file collected zero tests: ${file}`);
              ok = false;
              continue;
            }
            const executed = result.assertionResults.filter((a) => a.status !== "skipped").length;
            const failed = result.assertionResults.filter((a) => a.status === "failed").length;
            console.log(`focused gate: ${file} -> ${executed} executed, ${failed} failed`);
            if (executed === 0) {
              console.error(`::error::Expected test file collected zero tests: ${file}`);
              ok = false;
            }
            if (failed > 0) {
              console.error(`::error::Expected test file has failing tests: ${file}`);
              ok = false;
            }
          }
          process.exit(ok ? 0 : 1);
          NODE
          report_exit=$?
          set -e
          if [[ "$vitest_exit" -ne 0 || "$report_exit" -ne 0 ]]; then
            echo "::error::Focused gate failed (vitest_exit=$vitest_exit report_exit=$report_exit)" >&2
            exit 1
          fi

      - name: Build root production app
        run: npm run build

      - name: Run standalone runtime smoke
        run: STANDALONE_SMOKE_SKIP_BUILD=1 npm run test:runtime

      - name: Build and validate npm package
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack --dry-run --json > /tmp/showdar-router-pack.json
          PACK_FILE=/tmp/showdar-router-pack.json node - <<'NODE'
          const fs = require("node:fs");
          const pack = JSON.parse(fs.readFileSync(process.env.PACK_FILE, "utf8"))[0];
          const cli = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const root = JSON.parse(fs.readFileSync("../package.json", "utf8"));
          if (root.version !== cli.version) throw new Error(`Version mismatch: root ${root.version}, cli ${cli.version}`);
          const files = new Set(pack.files.map((file) => file.path));
          for (const file of [
            "cli.js",
            "app/custom-server.js",
            "app/server.js",
            "assets/showdar-router-banner.png",
            "assets/showdar-router-terminal.png",
            "README.md",
            "LICENSE",
          ]) {
            if (!files.has(file)) throw new Error(`Missing package file: ${file}`);
          }
          console.log(JSON.stringify({ name: pack.name, version: pack.version, files: pack.entryCount }));
          NODE

      - name: Reject unexpected generated source-root artifacts
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          unexpected="$(printf '%s\n' "$status" | awk '$2 == "Users/" || $2 ~ /^Users\//')"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated source-root artifacts:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
